name: Kiro Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    environment: kiro-code-review
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Kiro CLI
        run: curl -fsSL https://cli.kiro.dev/install | bash

      - name: Review PR changes
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: |
          git diff origin/main...HEAD | kiro-cli chat \
            --no-interactive \
            --trust-all-tools \
            "Review the changes in this PR for code quality, security issues, notebook best practices, and infrastructure patterns. Group findings by severity (critical, warning, suggestion). At the end, output exactly one of these verdicts on its own line: VERDICT: PASS or VERDICT: FAIL (use FAIL only for critical security or correctness issues)." \
            | tee /tmp/kiro-review.txt

      - name: Post review as PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "## 🔍 Kiro Code Review" > /tmp/comment.md
          echo "" >> /tmp/comment.md
          cat /tmp/kiro-review.txt >> /tmp/comment.md
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file /tmp/comment.md

      - name: Check verdict
        run: |
          if grep -q "VERDICT: FAIL" /tmp/kiro-review.txt; then
            echo "::error::Kiro review found critical issues"
            exit 1
          fi
          echo "Kiro review passed"
